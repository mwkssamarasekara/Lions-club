<!DOCTYPE html>
<html lang="si" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery Manager | Dashboard — Lions Diamond</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" href="../assets/img/logo.png" type="image/png">
  <script>
    (function() {
      const saved = localStorage.getItem('lions-theme');
      if (saved) {
        document.documentElement.setAttribute('data-theme', saved);
      }
    })();
  </script>
</head>
<body>

  <div class="dashboard-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand"><img src="../assets/img/logo.png" alt="Logo"><span>Lions Diamond</span></div>
      <nav class="sidebar-nav">
        <a href="index.html"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
        <a href="members.html"><i class="fa-solid fa-users"></i> Members</a>
        <a href="projects.html"><i class="fa-solid fa-diagram-project"></i> Projects</a>
        <a href="join-requests.html"><i class="fa-solid fa-user-plus"></i> Join Requests</a>
        <a href="donations.html"><i class="fa-solid fa-hand-holding-dollar"></i> Donations</a>
        <a href="gallery.html" class="active"><i class="fa-solid fa-images"></i> Gallery</a>
        <div class="nav-divider"></div>
        <a href="../index.html"><i class="fa-solid fa-globe"></i> View Website</a>
        <a href="#" id="logoutBtn" style="color:rgba(239,68,68,0.8);"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
      </nav>
    </aside>

    <main class="dashboard-main">
      <header class="dashboard-topbar">
        <div style="display:flex;align-items:center;gap:var(--space-md);">
          <button class="sidebar-toggle" id="sidebarToggle"><i class="fa-solid fa-bars"></i></button>
          <h2><i class="fa-solid fa-images" style="color:var(--purple-600);"></i> Gallery Manager</h2>
        </div>
        <div style="display:flex;align-items:center;gap:var(--space-md);">
          <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
            <i class="fa-solid fa-sun"></i>
            <i class="fa-solid fa-moon"></i>
          </button>
          <button class="btn btn-sm btn-primary" id="addImageBtn"><i class="fa-solid fa-plus"></i> Add Image</button>
        </div>
      </header>

      <div class="dashboard-content">
        <div class="toolbar">
          <div class="filter-tabs" style="margin-bottom:0;">
            <button class="filter-tab active" data-filter="All">All</button>
            <button class="filter-tab" data-filter="Meeting">Meetings</button>
            <button class="filter-tab" data-filter="Service">Service</button>
            <button class="filter-tab" data-filter="Donation">Donations</button>
          </div>
          <p style="color:var(--gray-400);font-size:0.85rem;margin:0;"><span id="imageCount">0</span> images</p>
        </div>

        <div class="dash-gallery-grid" id="galleryGrid">
          <div class="spinner" style="grid-column:1/-1;"></div>
        </div>

        <div class="empty-state" id="emptyState" style="display:none;">
          <i class="fa-solid fa-image"></i>
          <p>No images in gallery yet.</p>
        </div>
      </div>
    </main>
  </div>

  <!-- Add Image Modal -->
  <div class="modal-overlay" id="addModal">
    <div class="modal">
      <div class="modal-header">
        <h3><i class="fa-solid fa-image" style="color:var(--purple-600);"></i> Add Image</h3>
        <button class="modal-close" id="modalClose"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="imageForm">
        <!-- Upload Tabs -->
        <div class="upload-tabs">
          <button type="button" class="upload-tab active" data-upload-mode="file"><i class="fa-solid fa-computer"></i> Upload File</button>
          <button type="button" class="upload-tab" data-upload-mode="url"><i class="fa-solid fa-link"></i> Image URL</button>
        </div>

        <!-- File Upload Zone -->
        <div id="uploadFileSection">
          <div class="upload-zone" id="uploadZone">
            <input type="file" id="imageFile" accept="image/*">
            <div class="upload-zone-icon"><i class="fa-solid fa-cloud-arrow-up"></i></div>
            <p class="upload-zone-text"><strong>Click to choose</strong> or drag & drop</p>
            <p class="upload-zone-hint">PNG, JPG, WEBP up to 5MB</p>
          </div>
          <div class="upload-preview" id="filePreview">
            <img id="filePreviewImg" src="" alt="Preview">
          </div>
        </div>

        <!-- URL Input (hidden by default) -->
        <div id="uploadURLSection" style="display:none;">
          <div class="form-group">
            <label><i class="fa-solid fa-link"></i> Image URL</label>
            <input type="url" class="form-control" id="imageURL" placeholder="https://example.com/photo.jpg">
          </div>
          <div id="imagePreview" style="display:none;margin-bottom:var(--space-lg);border-radius:var(--radius-md);overflow:hidden;max-height:200px;">
            <img id="previewImg" src="" alt="Preview" style="width:100%;height:200px;object-fit:cover;">
          </div>
        </div>

        <div class="form-group">
          <label><i class="fa-solid fa-tag"></i> Category</label>
          <select class="form-control" id="imageCategory" required>
            <option value="Meeting">Meeting</option>
            <option value="Service">Service</option>
            <option value="Donation">Donation</option>
          </select>
        </div>
        <button type="submit" class="btn btn-purple" style="width:100%;justify-content:center;" id="saveBtn">
          <i class="fa-solid fa-upload"></i> Add to Gallery
        </button>
      </form>
    </div>
  </div>

  <script type="module">
    import { requireAuth, logoutUser } from '../js/auth.js';
    import { getGalleryImages, addGalleryImage, deleteGalleryImage } from '../js/firestore-db.js';

    let allImages = [];

    function renderGallery(images) {
      const grid = document.getElementById('galleryGrid');
      const empty = document.getElementById('emptyState');
      document.getElementById('imageCount').textContent = images.length;

      if (images.length === 0) {
        grid.innerHTML = '';
        empty.style.display = 'block';
        return;
      }

      empty.style.display = 'none';
      grid.innerHTML = images.map(img => `
        <div class="dash-gallery-item">
          <img src="${img.imageURL}" alt="${img.category}" loading="lazy">
          <div class="overlay-actions">
            <span class="badge badge-upcoming" style="position:absolute;top:8px;left:8px;">${img.category}</span>
            <button class="action-btn delete" onclick="removeImage('${img.id}')" title="Delete" style="width:40px;height:40px;border-radius:50%;font-size:1rem;">
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>
        </div>
      `).join('');
    }

    async function loadGallery() {
      allImages = await getGalleryImages();
      renderGallery(allImages);
    }

    requireAuth(() => loadGallery());

    // Delete
    window.removeImage = async (id) => {
      if (!confirm('Remove this image from gallery?')) return;
      await deleteGalleryImage(id);
      loadGallery();
    };

    // Modal
    const modal = document.getElementById('addModal');
    let uploadMode = 'file';
    let selectedFileData = null;

    document.getElementById('addImageBtn').addEventListener('click', () => modal.classList.add('active'));
    document.getElementById('modalClose').addEventListener('click', () => {
      modal.classList.remove('active');
      resetUploadForm();
    });
    modal.addEventListener('click', (e) => { if (e.target === modal) { modal.classList.remove('active'); resetUploadForm(); } });

    function resetUploadForm() {
      document.getElementById('imageForm').reset();
      document.getElementById('filePreview').style.display = 'none';
      document.getElementById('imagePreview').style.display = 'none';
      selectedFileData = null;
    }

    // Upload mode tabs
    document.querySelectorAll('.upload-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.upload-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        uploadMode = tab.dataset.uploadMode;
        document.getElementById('uploadFileSection').style.display = uploadMode === 'file' ? 'block' : 'none';
        document.getElementById('uploadURLSection').style.display = uploadMode === 'url' ? 'block' : 'none';
        resetUploadForm();
      });
    });

    // File upload - choose from computer
    const fileInput = document.getElementById('imageFile');
    const uploadZone = document.getElementById('uploadZone');

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      handleFileSelect(file);
    });

    // Drag and drop
    uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
    uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
    uploadZone.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadZone.classList.remove('drag-over');
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) {
        handleFileSelect(file);
      }
    });

    function handleFileSelect(file) {
      if (file.size > 5 * 1024 * 1024) {
        alert('File too large. Maximum 5MB.');
        return;
      }
      const reader = new FileReader();
      reader.onload = (e) => {
        selectedFileData = e.target.result;
        document.getElementById('filePreviewImg').src = selectedFileData;
        document.getElementById('filePreview').style.display = 'block';
      };
      reader.readAsDataURL(file);
    }

    // URL Preview (for URL mode)
    document.getElementById('imageURL').addEventListener('input', (e) => {
      const url = e.target.value;
      const preview = document.getElementById('imagePreview');
      const img = document.getElementById('previewImg');
      if (url && (url.startsWith('http://') || url.startsWith('https://'))) {
        img.src = url;
        preview.style.display = 'block';
        img.onerror = () => { preview.style.display = 'none'; };
      } else {
        preview.style.display = 'none';
      }
    });

    // Save
    document.getElementById('imageForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('saveBtn');

      let imageURL = '';
      if (uploadMode === 'file') {
        if (!selectedFileData) {
          alert('Please choose an image file first.');
          return;
        }
        imageURL = selectedFileData;
      } else {
        imageURL = document.getElementById('imageURL').value;
        if (!imageURL) {
          alert('Please enter an image URL.');
          return;
        }
      }

      btn.disabled = true;
      btn.innerHTML = '<div class="spinner" style="width:18px;height:18px;margin:0;border-width:2px;"></div>';

      await addGalleryImage({
        imageURL: imageURL,
        category: document.getElementById('imageCategory').value
      });

      modal.classList.remove('active');
      resetUploadForm();
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-upload"></i> Add to Gallery';
      loadGallery();
    });

    // Filters
    document.querySelectorAll('.filter-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const f = tab.dataset.filter;
        renderGallery(f === 'All' ? allImages : allImages.filter(i => i.category === f));
      });
    });

    document.getElementById('logoutBtn').addEventListener('click', (e) => { e.preventDefault(); logoutUser(); });
    document.getElementById('sidebarToggle').addEventListener('click', () => document.getElementById('sidebar').classList.toggle('open'));

    // Dark / Light Mode Toggle
    const themeToggle = document.getElementById('themeToggle');
    themeToggle.addEventListener('click', () => {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('lions-theme', next);
    });
  </script>

</body>
</html>
